# 推送到 main 后自动测试并部署。
#
# 部署机制：`wrangler deploy` 在仓库根目录跑时，会读 `.wrangler/deploy/config.json`
# 找到 Vite 插件生成的 `dist/hezu_life_manager/wrangler.json`，而不是根目录的
# `wrangler.jsonc`。所以**部署前必须重新构建**——不能把构建产物用 artifact 传过来，
# 因为 upload-artifact 默认丢弃 `.` 开头的隐藏路径，正好会把 `.wrangler/deploy/` 漏掉。
#
# 两个 job 都各自构建一次，看起来重复，但这是唯一可靠的做法。

name: 部署

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 页面手动触发

# 连续推送时只保留最新一次，避免两个部署互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 单元测试
        run: npm test
        env:
          # test/auth.test.ts 里有两条断言本机耗时的金丝雀测试。
          # GitHub 的 runner 比开发机慢，用开发机的阈值（3.3ms）会误报。
          # 这不影响判断的严格性：真正防「有人调高轮数」的是那条
          # 断言 PBKDF2_ITERATIONS 上限的确定性测试，与机器快慢无关。
          HZM_CPU_LOCAL_BUDGET_MS: '8'

      # build 里已经含 `tsc --noEmit`，不必单独再跑一次类型检查
      - name: 类型检查与构建
        run: npm run build

  deploy:
    name: 部署到 Cloudflare
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 检查凭据
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::缺少仓库 Secret「CLOUDFLARE_API_TOKEN」。配置方法见 README 的「CI 自动部署」一节。"
            exit 1
          fi

      # 必须先构建，`wrangler deploy` 依赖 dist/ 和 .wrangler/deploy/config.json
      - run: npm run build

      # 直接用仓库里锁定的 wrangler（package-lock.json 里的版本），不用
      # cloudflare/wrangler-action——那个 action 也只是包了一层同样的命令，
      # 换成它反而让部署版本变成由第三方 action 决定，不可复现。
      - name: 部署
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
